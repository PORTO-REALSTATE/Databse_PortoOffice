<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة العقارات</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', sans-serif; }
        .table-responsive { border-radius: 8px; background: #161b22; margin-top: 10px; }
        .table { min-width: 900px; color: #c9d1d9; vertical-align: middle; }
        .table th { background: #21262d; color: #8b949e; border: none; font-size: 0.85rem; }
        .table td { border-bottom: 1px solid #30363d; padding: 12px 8px; }
        .action-link { color: #58a6ff; text-decoration: none; font-weight: bold; font-size: 1.2rem; cursor: pointer; }
        .modal-content { background: #1c2128; border: 1px solid #444c56; color: #fff; border-radius: 12px; }
        .form-control { background: #fff !important; color: #000 !important; font-weight: bold; }
        .calc-box { background: #f0f0f0 !important; color: #d63384 !important; border: 2px solid #dee2e6 !important; cursor: not-allowed; }
        .add-btn { background: #238636; color: white; border-radius: 50%; width: 40px; height: 40px; border: none; font-size: 24px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body class="p-3">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="m-0 text-primary">Porto Database</h5>
        <div class="d-flex gap-2">
            <button class="add-btn" data-bs-toggle="modal" data-bs-target="#addModal">+</button>
            <a href="login.html" class="btn btn-primary btn-sm">دخول</a>
        </div>
    </div>

    <form class="mb-3" onsubmit="event.preventDefault();">
        <div class="input-group">
            <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="بحث بالاسم أو المبنى...">
            <button class="btn btn-primary" type="button">بحث</button>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table text-center">
            <thead>
                <tr>
                    <th>⚙️</th>
                    <th>المالك</th>
                    <th>المبنى</th>
                    <th>المساحة</th>
                    <th>المقدم</th>
                    <th>الأقساط</th>
                    <th>الإجمالي</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>
                        <div class="d-flex gap-2 justify-content-center">
                            <span class="action-link" data-bs-toggle="modal" data-bs-target="#editDemo">&gt;</span>
                            <span class="text-danger" style="cursor:pointer;" onclick="confirm('حذف؟')">🗑️</span>
                        </div>
                    </td>
                    <td class="fw-bold">أحمد محمد عبد الله</td>
                    <td>مبنى A1</td>
                    <td>120 م²</td>
                    <td class="text-info">50,000</td>
                    <td class="text-danger">150,000</td>
                    <td class="text-success fw-bold">200,000</td>
                </tr>

                <div class="modal fade" id="editDemo" tabindex="-1">
                    <div class="modal-dialog modal-lg modal-dialog-centered">
                        <div class="modal-content">
                            <div class="modal-header border-secondary">
                                <h6>تعديل: أحمد محمد عبد الله</h6>
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                            </div>
                            <form onsubmit="event.preventDefault();">
                                <div class="modal-body">
                                    <div class="row g-2">
                                        <div class="col-md-6"><label class="small text-secondary">المالك</label><input type="text" class="form-control" value="أحمد محمد عبد الله"></div>
                                        <div class="col-md-3"><label class="small text-secondary">المبنى</label><input type="text" class="form-control" value="مبنى A1"></div>
                                        <div class="col-md-3"><label class="small text-secondary">الدور</label><input type="text" class="form-control" value="الثالث"></div>
                                        <div class="col-md-4"><label class="small text-secondary">المساحة</label><input type="text" class="form-control" value="120 م²"></div>
                                        <div class="col-md-4"><label class="small text-secondary">المنطقة</label><input type="text" class="form-control" value="المرحلة الأولى"></div>
                                        <div class="col-md-4"><label class="small text-secondary">الفيو</label><input type="text" class="form-control" value="لاندسكيب"></div>
                                        <div class="col-md-4"><label class="small text-primary">المقدم</label><input type="text" class="form-control down_val" value="50,000"></div>
                                        <div class="col-md-4"><label class="small text-primary">القسط</label><input type="text" class="form-control inst_val" value="5,000"></div>
                                        <div class="col-md-4"><label class="small text-primary">العدد</label><input type="number" class="form-control inst_num" value="30"></div>
                                        <div class="col-md-6"><label class="small text-danger">مجموع الأقساط</label><input type="text" class="form-control calc-box total_inst" readonly></div>
                                        <div class="col-md-6"><label class="small text-success">الإجمالي الكلي</label><input type="text" class="form-control calc-box total_all" readonly></div>
                                    </div>
                                </div>
                                <div class="modal-footer border-0">
                                    <button type="button" class="btn btn-success w-100" data-bs-dismiss="modal">حفظ التعديلات (معاينة)</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

            </tbody>
        </table>
    </div>

    <div class="modal fade" id="addModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-secondary">
                    <h6>إضافة بيانات جديدة</h6>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form class="mb-4 pb-3 border-bottom border-secondary" onsubmit="event.preventDefault();">
                        <label class="small text-info mb-2">استيراد Excel</label>
                        <div class="input-group">
                            <input type="file" class="form-control" accept=".xlsx, .xls" required>
                            <button type="button" class="btn btn-info text-white">رفع</button>
                        </div>
                    </form>
                     
                    <form onsubmit="event.preventDefault();">
                        <div class="row g-2">
                            <div class="col-md-6"><input type="text" class="form-control" placeholder="المالك" required></div>
                            <div class="col-md-3"><input type="text" class="form-control" placeholder="المبنى"></div>
                            <div class="col-md-3"><input type="text" class="form-control" placeholder="الدور"></div>
                            <div class="col-md-4"><input type="text" class="form-control" placeholder="المساحة"></div>
                            <div class="col-md-4"><input type="text" class="form-control" placeholder="المنطقة"></div>
                            <div class="col-md-4"><input type="text" class="form-control" placeholder="الفيو"></div>
                            <div class="col-md-4"><input type="text" class="form-control down_val" placeholder="المقدم"></div>
                            <div class="col-md-4"><input type="text" class="form-control inst_val" placeholder="القسط"></div>
                            <div class="col-md-4"><input type="number" class="form-control inst_num" placeholder="العدد"></div>
                            <div class="col-md-6"><input type="text" class="form-control calc-box total_inst" placeholder="مجموع الأقساط" readonly></div>
                            <div class="col-md-6"><input type="text" class="form-control calc-box total_all" placeholder="الإجمالي" readonly></div>
                        </div>
                        <button type="button" class="btn btn-success w-100 mt-3" data-bs-dismiss="modal">إضافة يدوية</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function setupCalculations() {
            document.querySelectorAll('.modal').forEach(modal => {
                const downInput = modal.querySelector('.down_val');
                const instValInput = modal.querySelector('.inst_val');
                const instNumInput = modal.querySelector('.inst_num');
                
                if (!downInput || !instValInput || !instNumInput) return;

                const inputs = [downInput, instValInput, instNumInput];
                
                const calc = () => {
                    let down = parseFloat(downInput.value.replace(/,/g, '')) || 0;
                    let iVal = parseFloat(instValInput.value.replace(/,/g, '')) || 0;
                    let iNum = parseFloat(instNumInput.value) || 0;
                    let sum = iVal * iNum;
                    
                    const totalInstField = modal.querySelector('.total_inst');
                    const totalAllField = modal.querySelector('.total_all');
                    
                    if (totalInstField) totalInstField.value = sum.toLocaleString('en-US');
                    if (totalAllField) totalAllField.value = (down + sum).toLocaleString('en-US');
                };
                
                inputs.forEach(i => {
                    i.removeEventListener('input', calc);
                    i.addEventListener('input', calc);
                });
                
                calc();
            });
        }
        document.addEventListener('shown.bs.modal', setupCalculations);
    </script>
</body>
</html>
