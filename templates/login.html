<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام العقارات</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background: #0d1117; 
            color: #c9d1d9; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-card {
            background: #161b22;
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid #30363d;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .form-control {
            background: #0d1117 !important;
            border: 1px solid #30363d !important;
            color: #fff !important;
            padding: 12px;
            margin-bottom: 1rem;
        }
        .form-control:focus {
            border-color: #58a6ff !important;
            box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.3);
        }
        .btn-login {
            background: #238636;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            font-weight: bold;
            border-radius: 6px;
            transition: 0.3s;
        }
        .btn-login:hover {
            background: #2ea043;
        }
        .brand-title {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #58a6ff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h4 class="brand-title">تسجيل الدخول للنظام</h4>
        <form action="/login" method="POST">
            <div class="mb-3">
                <label class="small mb-1 text-secondary">اسم المستخدم</label>
                <input type="text" name="username" class="form-control" placeholder="Admin" required autocomplete="off">
            </div>
            <div class="mb-3">
                <label class="small mb-1 text-secondary">كلمة المرور</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-login">دخول</button>
        </form>
        <div class="text-center mt-3">
            <a href="/" class="text-secondary small text-decoration-none">← العودة للرئيسية (عرض فقط)</a>
        </div>
    </div>

</body>
</html>
